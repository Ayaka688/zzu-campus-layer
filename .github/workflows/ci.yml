name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 不用 npm ci：lock 里带的是 Windows 上装出来的树，跨平台装一遍更稳
      - name: install
        run: npm install --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: 检查产物
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/pwa/index.html
          node -e "
          const m = require('./dist/manifest.json');
          if (m.manifest_version !== 3) throw new Error('manifest_version != 3');
          const hosts = m.host_permissions || [];
          const need = ['https://cas.s.zzu.edu.cn/*', 'https://jwxt.zzu.edu.cn/*', 'https://info.s.zzu.edu.cn/*', 'http://chat.zzu.edu.cn/*', 'http://order.lib.zzu.edu.cn/*'];
          for (const h of need) if (!hosts.includes(h)) throw new Error('host_permissions 缺少 ' + h);
          if (hosts.includes('<all_urls>') || hosts.includes('*://*/*')) throw new Error('不要申请 all_urls');
          console.log('manifest ok:', hosts.length, 'hosts');
          "
