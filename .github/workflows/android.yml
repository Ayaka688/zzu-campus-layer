name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'pwa/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: assembleDebug
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: campus-layer-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 除了 Actions 里的 artifact（下载要登录），再发一份到滚动 tag 的 Release，
      # 这样手机上不登 GitHub 也能直接点链接装。
      - name: 发到 apk-latest（免登录下载）
        if: github.ref == 'refs/heads/main'
        working-directory: mobile/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ./*.apk "${GITHUB_WORKSPACE}/campus-layer-debug.apk"
          cd "${GITHUB_WORKSPACE}"
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "安卓壳（最新构建）" --notes "每次 push 到 main 自动更新。下载 campus-layer-debug.apk 安装；没签名证书，装之前要在系统里允许安装未知来源应用。" --target main
          gh release upload apk-latest campus-layer-debug.apk --clobber
