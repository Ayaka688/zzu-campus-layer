name: pages

# 把 dist/ 发到 GitHub Pages，得到一个可以「加到主屏幕」的 HTTPS 地址
# 地址形如：https://<你的用户名>.github.io/zzu-campus-layer/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm install --no-audit --no-fund

      - name: build
        run: npm run build

      - name: 检查产物
        run: |
          test -f dist/index.html          # 站根跳转到 pwa/
          test -f dist/pwa/index.html
          test -f dist/pwa/pwa.webmanifest
          test -f dist/pwa/pwa-sw.js
          test -d dist/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 另外把构建产物作为压缩包挂到这次 run 上：
      # 没装 Node 的人可以直接下载解压，得到的就是可以「加载解压缩的扩展」的 dist 内容
      - uses: actions/upload-artifact@v4
        with:
          name: campus-layer-dist
          path: dist
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
